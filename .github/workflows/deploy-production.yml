name: Deploy Production to Cloudflare Pages

on:
  push:
    branches:
      - main

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    name: Build & Deploy Production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App (Production)
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://api.outscribed.com"
          VITE_MEDIA_BASE_URL: "https://media.outscribed.com"

      - name: Publish to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="outscribed-admin" --branch="main"
