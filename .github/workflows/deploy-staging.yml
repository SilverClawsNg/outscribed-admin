name: Deploy Staging to Cloudflare Pages

on:
  push:
    branches:
      - staging
      - 'feature/**'

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    name: Build & Deploy Staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Vue App (Staging)
        run: npm run build
        env:
          VITE_API_BASE_URL: "https://staging-api.outscribed.com"
          VITE_MEDIA_BASE_URL: "https://staging-media.outscribed.com"

      - name: Publish to Cloudflare Pages (Staging)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name="outscribed-admin-staging" --branch="staging"
